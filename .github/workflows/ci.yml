name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: every merge keeps its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - run: ruff check
      - run: ruff format --check
      - run: mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 pinned: ubuntu-latest moves to 26.04, which may never get 3.10 builds.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Non-editable install: the tests run against what the wheel actually contains.
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
          python -m pip install .
      - run: python -m pytest --cov
        env:
          # macOS runners have a real pasteboard: exercise copy and the detached clearer
          # end to end there. Elsewhere the clipboard tools are faked.
          ENTROPASS_CLIPBOARD_TESTS: ${{ runner.os == 'macOS' && '1' || '0' }}

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/entropass --version
          /tmp/smoke/bin/entropass password
          # Proves the wordlist made it into the wheel.
          /tmp/smoke/bin/entropass passphrase
